# TwinCAT check + TcUnit tests with TcAgent on a self-hosted Windows runner.
# Copy to .github/workflows/twincat.yml in your PLC repository and adjust SOLUTION.
# Runner: set up with setup-runner.ps1 from the TcAgent repository (installs TcAgent to C:\Tools\TcAgent, registers the runner
# with the label twincat and starts it at logon of a normal user).
# The runner needs Visual Studio 2022/XAE with TwinCAT 3.1, the runtime for tests, and must run as a user (see docs/PIPELINE.md).
name: TwinCAT

on:
  push:
    branches: [main]
  pull_request:

env:
  SOLUTION: MyMachine.sln                              # path of the solution in the repository
  TCAGENT: C:\Tools\TcAgent\TcAgent.exe                # where TcAgent is installed on the runner (setup-runner.ps1 / TcAgent.exe install)
  TCAGENT_ALLOW_TARGETS: local                         # only this PC may be activated

defaults:
  run:
    shell: powershell                                  # Windows PowerShell is always installed on the runner

# A self-hosted runner runs one job at a time - install only one runner per TwinCAT machine.

jobs:
  check:
    # never run pull requests from forks on this machine: a fork's workflow would run its own code on your PC
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, twincat]
    steps:
      - uses: actions/checkout@v4
      - name: Runner ready? (session, IDE, interop, runtime)
        run: '& $env:TCAGENT doctor; exit $LASTEXITCODE'
      - name: Check all objects
        run: '& $env:TCAGENT check --solution $env:SOLUTION --junit results/check.xml'
      # Optional: library versions as locked in .tcagent/libraries.lock.json (create it once with TcAgent.exe lock, commit it)
      # - name: Library lock
      #   run: '& $env:TCAGENT lock --solution $env:SOLUTION --check'
      # Optional: SBOM (CycloneDX 1.6) of the PLC project(s) as artifact
      # - name: SBOM
      #   run: '& $env:TCAGENT sbom --solution $env:SOLUTION --out results/sbom.cdx.json'
      - name: Publish compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: results/

  test:
    # never run pull requests from forks on this machine: a fork's workflow would run its own code on your PC
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: [self-hosted, windows, twincat]
    steps:
      - uses: actions/checkout@v4
      - name: Build, activate and run TcUnit
        run: '& $env:TCAGENT test --solution $env:SOLUTION --junit results/tests.xml --timeout 900'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/
      # Optional: show the results as a check run (third-party action, review it before use)
      # - uses: dorny/test-reporter@v1
      #   if: always()
      #   with: { name: TcUnit, path: results/tests.xml, reporter: java-junit }
