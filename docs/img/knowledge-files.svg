<text x="686" y="426" class="tool">tc_skills</text>
<text x="926" y="426" class="hs">Agent Skills format, mirrored to the CLIs</text>
<rect x="24" y="454" width="300" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
