<text x="40" y="41" class="t">Agent guide (skill) – how the agent works with TcAgent</text>
<text x="40" y="61" class="s">The same for every project. Installed into your AI client by Set up clients: SKILL.md (Claude skill), AGENTS.md, CLAUDE.md, GEMINI.md, copilot-instructions.md</text>
<rect x="24" y="96" width="172" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="40" cy="114" r="9" fill="#6366f1"/><text x="40" y="118" class="n" text-anchor="middle">1</text>
<text x="56" y="119" class="h">Built-in</text>
<text x="36" y="141" class="m" style="font-size:11.5px">knowledge\</text>
<text x="36" y="159" class="hs">shipped with TcAgent.exe</text>
<text x="36" y="176" class="v">updated with every version</text>
<text x="208.0" y="150" class="ar" text-anchor="middle">›</text>
<rect x="220" y="96" width="172" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="236" cy="114" r="9" fill="#6366f1"/><text x="236" y="118" class="n" text-anchor="middle">2</text>
<text x="252" y="119" class="h">Company</text>
<text x="232" y="141" class="m" style="font-size:11.5px">TCAGENT_COMPANY</text>
<text x="232" y="159" class="hs">network share or Git repository</text>
<text x="232" y="176" class="v">changes by pull request</text>
<text x="404.0" y="150" class="ar" text-anchor="middle">›</text>
<rect x="416" y="96" width="172" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="432" cy="114" r="9" fill="#6366f1"/><text x="432" y="118" class="n" text-anchor="middle">3</text>
<text x="448" y="119" class="h">You</text>
<text x="428" y="141" class="m" style="font-size:11.5px">%LOCALAPPDATA%\TcAgent\</text>
<text x="428" y="159" class="hs">your personal style</text>
<text x="428" y="176" class="v">every solution</text>
<text x="600.0" y="150" class="ar" text-anchor="middle">›</text>
<rect x="612" y="96" width="172" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="628" cy="114" r="9" fill="#6366f1"/><text x="628" y="118" class="n" text-anchor="middle">4</text>
<text x="644" y="119" class="h">Team</text>
<text x="624" y="141" class="m" style="font-size:11.5px">TCAGENT_TEAM</text>
<text x="624" y="159" class="hs">shared folder or Git, several: ;</text>
<text x="624" y="176" class="v">everybody in the team</text>
<text x="796.0" y="150" class="ar" text-anchor="middle">›</text>
<rect x="808" y="96" width="172" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="824" cy="114" r="9" fill="#6366f1"/><text x="824" y="118" class="n" text-anchor="middle">5</text>
<text x="840" y="119" class="h">Platform</text>
<text x="820" y="141" class="m" style="font-size:11.5px">platforms\&lt;name&gt;\</text>
<text x="820" y="159" class="hs">of company or you; own repos</text>
<text x="820" y="176" class="v">detected from the libraries</text>
<text x="992.0" y="150" class="ar" text-anchor="middle">›</text>
<rect x="1004" y="96" width="172" height="92" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<circle cx="1020" cy="114" r="9" fill="#6366f1"/><text x="1020" y="118" class="n" text-anchor="middle">6</text>
<text x="1036" y="119" class="h">Project</text>
<text x="1016" y="141" class="m" style="font-size:11.5px">&lt;solution&gt;\.tcagent\</text>
<text x="1016" y="159" class="hs">in Git with the project</text>
<text x="1016" y="176" class="v">this solution</text>
<text x="24" y="214" class="s">Read in this order – on conflicts the later level wins. A file marked tcagent-locked cannot be replaced by a later level; disabled.json switches a file off</text>
<text x="24" y="231" class="s">without changing it. The Knowledge window (tab Files) shows every file with its level and status – new, move to another level, delete, switch off, Git.</text>
<text x="28" y="262" class="h">What</text>
<text x="338" y="262" class="h">Same folder on every level</text>
<text x="678" y="262" class="h">Read and written with</text>
<text x="918" y="262" class="h">Good to know</text>
