<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-label="Where TcAgent keeps its knowledge: six levels from built-in to project, the same folder names on every level, and the files that are not layered">
