<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-label="How a TwinCAT pipeline runs: git push to GitHub, the self-hosted runner on the build machine fetches the job, runs TcAgent steps with a hidden Visual Studio and TwinCAT XAE, and sends the results back to GitHub">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
<style>text{font-family:"Segoe UI",system-ui,-apple-system,"DejaVu Sans",sans-serif}.t{font-size:15px;font-weight:700;fill:#0f172a}.h{font-size:13.5px;font-weight:700;fill:#0f172a}.s{font-size:12px;fill:#475569}.m{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#334155}.l{font-size:11.5px;fill:#4338ca}.lg{font-size:11.5px;fill:#15803d}.n{font-size:12px;font-weight:700;fill:#ffffff}.z{font-size:12px;font-weight:700;fill:#64748b;letter-spacing:.06em}</style>
<rect x="0" y="0" width="1000" height="610" rx="14" fill="#f8fafc" stroke="none" stroke-width="1.2" />
<rect x="20" y="20" width="210" height="440" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="36" y="44" class="z" text-anchor="start">DEVELOPER PC</text>
<rect x="250" y="20" width="240" height="440" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="266" y="44" class="z" text-anchor="start">GITHUB</text>
<rect x="560" y="20" width="420" height="440" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
<text x="576" y="44" class="z" text-anchor="start">BUILD MACHINE  (your PC, a VM or a Beckhoff IPC)</text>
<rect x="36" y="62" width="178" height="96" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
<text x="48" y="84" class="h" text-anchor="start">TwinCAT project</text>
<text x="48" y="102" class="s" text-anchor="start">Visual Studio / XAE,</text>
<text x="48" y="118" class="s" text-anchor="start">agent with TcAgent</text>
<text x="48" y="140" class="m" text-anchor="start">git commit</text>
<text x="36" y="190" class="s" text-anchor="start">Only pushes - it does not</text>
<text x="36" y="206" class="s" text-anchor="start">have to be switched on</text>
<text x="36" y="222" class="s" text-anchor="start">while the pipeline runs.</text>
<rect x="264" y="62" width="212" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="276" y="84" class="h" text-anchor="start">Repository (private)</text>
<text x="276" y="104" class="m" text-anchor="start">.github/workflows/</text>
<text x="276" y="119" class="m" text-anchor="start">   twincat.yml</text>
<text x="276" y="136" class="m" text-anchor="start">.tcagent/pipeline.json</text>
<text x="276" y="151" class="m" text-anchor="start">TwinCAT/*.sln …</text>
<rect x="264" y="178" width="212" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="276" y="200" class="h" text-anchor="start">Actions</text>
<text x="276" y="219" class="s" text-anchor="start">the job waits for a runner</text>
<text x="276" y="235" class="m" text-anchor="start">runs-on: [self-hosted,</text>
<text x="276" y="252" class="m" text-anchor="start">          windows, twincat]</text>
<rect x="264" y="290" width="212" height="154" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
<text x="276" y="312" class="h" text-anchor="start">Results of the run</text>
<text x="276" y="332" class="s" text-anchor="start">✓ / ✗ per step with log</text>
<text x="276" y="350" class="s" text-anchor="start">summary table</text>
<text x="276" y="368" class="s" text-anchor="start">compiler errors as</text>
<text x="276" y="384" class="s" text-anchor="start">annotations on the code</text>
<text x="276" y="404" class="s" text-anchor="start">artifact twincat-results:</text>
<text x="276" y="421" class="s" text-anchor="start">JUnit, HTML doc + risks</text>
<rect x="574" y="62" width="392" height="100" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
<text x="586" y="84" class="h" text-anchor="start">GitHub runner  C:\actions-runner</text>
<text x="586" y="104" class="s" text-anchor="start">runs as the logged-on user (desktop session), no service;</text>
<text x="586" y="120" class="s" text-anchor="start">started at logon by a scheduled task (setup-runner.ps1)</text>
<text x="586" y="140" class="s" text-anchor="start">.env:</text>
<text x="622" y="140" class="m" text-anchor="start">TCAGENT=C:\Tools\TcAgent\TcAgent.exe</text>
<text x="622" y="155" class="m" text-anchor="start">TCAGENT_ALLOW_TARGETS=local</text>
<rect x="574" y="178" width="392" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="586" y="199" class="h" text-anchor="start">Fresh checkout of the pushed commit</text>
<text x="586" y="219" class="m" text-anchor="start">C:\actions-runner\_work\&lt;repo&gt;\&lt;repo&gt;</text>
<rect x="574" y="248" width="392" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="586" y="270" class="h" text-anchor="start">TcAgent.exe ci  - steps from pipeline.json</text>
<rect x="586" y="286" width="170" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="596" y="302" class="m" text-anchor="start">1  doctor</text>
<text x="766" y="302" class="s" text-anchor="start">machine ready?</text>
<rect x="586" y="316" width="170" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="596" y="332" class="m" text-anchor="start">2  check</text>
<text x="766" y="332" class="s" text-anchor="start">check all objects</text>
<rect x="586" y="346" width="170" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="596" y="362" class="m" text-anchor="start">3  build</text>
<text x="766" y="362" class="s" text-anchor="start">build the solution</text>
<rect x="586" y="376" width="170" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="596" y="392" class="m" text-anchor="start">4  doc --risks</text>
<text x="766" y="392" class="s" text-anchor="start">documentation + risk list</text>
<rect x="586" y="410" width="368" height="26" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.2" />
<text x="596" y="427" class="s" text-anchor="start">each step opens its own hidden Visual Studio + XAE</text>
<circle cx="235" cy="92" r="11" fill="#6366f1"/>
<text x="235" y="96" class="n" text-anchor="middle">1</text>
<path d="M 214 110 L 260 110" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#ah)"/>
<text x="222" y="100" class="l" text-anchor="start"></text>
<text x="235" y="132" class="l" text-anchor="middle">push</text>
<circle cx="525" cy="92" r="11" fill="#6366f1"/>
<text x="525" y="96" class="n" text-anchor="middle">2</text>
<path d="M 574 112 L 480 112" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="525" y="132" class="l" text-anchor="middle">asks</text>
<text x="525" y="146" class="l" text-anchor="middle">for jobs</text>
<path d="M 476 210 L 570 210" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="525" cy="194" r="11" fill="#6366f1"/>
<text x="525" y="198" class="n" text-anchor="middle">3</text>
<text x="525" y="230" class="l" text-anchor="middle">job +</text>
<text x="525" y="244" class="l" text-anchor="middle">checkout</text>
<circle cx="948" cy="265" r="11" fill="#6366f1"/>
<text x="948" y="269" class="n" text-anchor="middle">4</text>
<path d="M 574 366 L 480 366" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/>
<circle cx="525" cy="350" r="11" fill="#16a34a"/>
<text x="525" y="354" class="n" text-anchor="middle">5</text>
<text x="525" y="386" class="lg" text-anchor="middle">exit codes,</text>
<text x="525" y="400" class="lg" text-anchor="middle">logs, files</text>
<rect x="20" y="476" width="960" height="116" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
<circle cx="40" cy="494" r="11" fill="#6366f1"/>
<text x="40" y="498" class="n" text-anchor="middle">1</text>
<text x="60" y="498" class="s" text-anchor="start">You push. GitHub starts the workflow; the job waits until a runner with matching labels is free.</text>
<circle cx="40" cy="514" r="11" fill="#6366f1"/>
<text x="40" y="518" class="n" text-anchor="middle">2</text>
<text x="60" y="518" class="s" text-anchor="start">The runner asks GitHub for work - outgoing HTTPS only, no open port and no inbound connection to your machine.</text>
<circle cx="40" cy="534" r="11" fill="#6366f1"/>
<text x="40" y="538" class="n" text-anchor="middle">3</text>
<text x="60" y="538" class="s" text-anchor="start">It takes the job and checks out exactly the pushed commit - local, unpushed changes are not part of the build.</text>
<circle cx="40" cy="554" r="11" fill="#6366f1"/>
<text x="40" y="558" class="n" text-anchor="middle">4</text>
<text x="60" y="558" class="s" text-anchor="start">TcAgent.exe ci runs the steps one after the other; one TwinCAT runtime per machine, so one job at a time.</text>
<circle cx="40" cy="574" r="11" fill="#16a34a"/>
<text x="40" y="578" class="n" text-anchor="middle">5</text>
<text x="60" y="578" class="s" text-anchor="start">Exit code per step: 0 OK · 1 project error (red) · 2 refused (configuration) · 3 build machine problem.</text>
</svg>
