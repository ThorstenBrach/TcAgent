<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="The Advisor goes with the plant from development to operation: Advisor Shadow at night in the pipeline, Advisor Live at commissioning and in operation. It reads and advises, it changes nothing.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Segoe UI",system-ui,-apple-system,"DejaVu Sans",sans-serif}.t{font-size:16px;font-weight:700;fill:#0f172a}.p{font-size:14px;font-weight:700;fill:#0f172a}.h{font-size:14.5px;font-weight:700;fill:#0f172a}.s{font-size:12.5px;fill:#475569}.k{font-size:12.5px;fill:#0f172a}.b{font-size:12px;font-weight:700;fill:#0f172a}.f{font-size:12.5px;fill:#475569}</style>
<rect x="0" y="0" width="1000" height="330" rx="14" fill="#f8fafc"/>
<text x="24" y="34" class="t">The Advisor goes with the plant from development to operation - it reads and advises, it changes nothing</text>
<rect x="24" y="56" width="952" height="36" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="172" y="79" class="p" text-anchor="middle">Development</text>
<path d="M242,74 L420,74" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="500" y="79" class="p" text-anchor="middle">Commissioning</text>
<path d="M570,74 L748,74" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="828" y="79" class="p" text-anchor="middle">Operation</text>
<path d="M172,92 L172,120" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="24" y="120" width="296" height="178" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="40" y="146" class="h">Nightly in the pipeline</text>
<rect x="40" y="158" width="124" height="22" rx="11" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.2"/>
<text x="102" y="173" class="b" text-anchor="middle">Advisor Shadow</text>
<text x="40" y="204" class="s">Who: the team</text>
<text x="40" y="221" class="s">Trigger: night, commit,</text>
<text x="40" y="238" class="s">failed pipeline</text>
<text x="40" y="262" class="k">In the morning: review and</text>
<text x="40" y="279" class="k">cause, each with an order</text>
<path d="M500,92 L500,120" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="352" y="120" width="296" height="178" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="368" y="146" class="h">Help at commissioning</text>
<rect x="368" y="158" width="124" height="22" rx="11" fill="#ea580c" fill-opacity="0.14" stroke="#ea580c" stroke-width="1.2"/>
<text x="430" y="173" class="b" text-anchor="middle">Advisor Live</text>
<text x="368" y="204" class="s">Who: the commissioning engineer</text>
<text x="368" y="221" class="s">Trigger: the person in the chat</text>
<text x="368" y="238" class="s">Reads: values, chains, I/O</text>
<text x="368" y="262" class="k">At once: diagnosis in the</text>
<text x="368" y="279" class="k">conversation, with an order</text>
<path d="M828,92 L828,120" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="680" y="120" width="296" height="178" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="696" y="146" class="h">Troubleshooting in operation</text>
<rect x="696" y="158" width="124" height="22" rx="11" fill="#ea580c" fill-opacity="0.14" stroke="#ea580c" stroke-width="1.2"/>
<text x="758" y="173" class="b" text-anchor="middle">Advisor Live</text>
<text x="696" y="204" class="s">Who: maintenance</text>
<text x="696" y="221" class="s">Trigger: person, alarm, PLC</text>
<text x="696" y="238" class="s">exception, fault signal</text>
<text x="696" y="262" class="k">At once: cause and an order</text>
<text x="696" y="279" class="k">to fix it</text>
<text x="500" y="316" class="f" text-anchor="middle">You rate each finding; "Act on it" hands the order to an agent, which works with the usual workflows and checkpoints.</text>
</svg>
