name: Feature request
description: A tool, an option or a workflow that is missing.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task you want to do - not only the solution you have in mind. Please leave out customer, machine and
        project names. Ideas that are not yet a concrete request fit well into the Discussions.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues and found none for this request.
          required: true
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What do you want to do with TcAgent, and why does it not work today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work - a tool, a parameter, a window, a workflow step.
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds, other tools, manual steps.
  - type: dropdown
    id: importance
    attributes:
      label: Importance for you
      options:
        - nice to have
        - saves a lot of time
        - needed for my work
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PLC code and refactoring
        - Build, check and activation
        - Tests (TcUnit)
        - I/O, motion, HMI, system
        - Chat window and AI clients
        - Knowledge (rules, skills, workflows, lessons, sources)
        - Pipeline and command line
        - Other
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help
      options:
        - "No"
        - I can test a preview version
        - I would like to contribute a pull request
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Only if it matters for the feature - chat window menu ⋯ > Copy diagnostics, or TcAgent.exe diag
