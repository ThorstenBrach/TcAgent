name: Feature request
description: A tool, an option or a workflow that is missing.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task you want to do - not only the solution you have in mind. Please leave out customer, machine and
        project names.
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What do you want to do with TcAgent, and why does it not work today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work - a tool, a parameter, a window, a workflow step.
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds, other tools, manual steps.
  - type: dropdown
    id: importance
    attributes:
      label: Importance for you
      options:
        - nice to have
        - saves a lot of time
        - needed for my work
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PLC code and refactoring
        - Build, check and activation
        - Tests (TcUnit)
        - I/O, motion, HMI, system
        - Chat window and AI clients
        - Knowledge (rules, skills, workflows, lessons, sources)
        - Pipeline and command line
        - Other
    validations:
      required: true
  - type: input
    id: tcagent
    attributes:
      label: TcAgent version
      placeholder: "0.42.6"
  - type: input
    id: twincat
    attributes:
      label: TwinCAT version and IDE
      description: If it matters for the feature - TwinCAT build and Visual Studio / XAE Shell version
      placeholder: "3.1.4026.19, Visual Studio 2022 17.14"
