name: Bug report
description: A tool fails, crashes the IDE or does something unexpected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please leave out customer, machine and project names, IP addresses and paths that identify
        your company - an issue is public. The knowledge window of TcAgent (tab Feedback) prepares an anonymized report.
        A security problem? Please report it privately (see SECURITY.md), not here.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues and found none for this problem.
          required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The affected tool or window, e.g. tc_plc_write, tc_test_run, TcUnit Tests window, chat window
      placeholder: tc_plc_write
    validations:
      required: true
  - type: dropdown
    id: cause
    attributes:
      label: Where is the problem
      description: A tool error is fixed in the code, a wrong decision of the agent usually in its rules, skills or workflows.
      options:
        - A tool returned an error or a wrong result
        - The agent decided wrong (the tools worked, the result is not what I asked for)
        - The IDE or TwinCAT itself (dialog, crash, hang)
        - I don't know
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The call and its arguments, the error message, what you saw in the IDE.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As small as possible - a new solution with one POU is ideal.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: How you got the task done anyway, if at all.
  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducible
      options:
        - always
        - sometimes
        - happened once
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - minor - annoying, there is a way around it
        - major - a task cannot be done
        - blocker - the IDE crashes or data is lost
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How TcAgent ran
      options:
        - Interactive - an AI client or the TcAgent chat with the IDE
        - Command line or pipeline (TcAgent.exe check/build/test/ci ...)
        - Both
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Versions of TcAgent, the extension, TwinCAT and the IDEs. In the IDE: chat window menu ⋯ > Copy diagnostics,
        or knowledge window, tab Feedback > Copy diagnostics. Without the IDE: TcAgent.exe diag
      placeholder: |
        - **TcAgent extension (bridge):** 0.43.0
        - **IDE (this window):** Visual Studio 2022 17.14.x
        - **TcAgent:** 0.43.0 (64-bit, installed by the extension)
        - **TwinCAT:** 3.1.4026.19
        ...
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: "Claude Code, Copilot CLI, Gemini CLI, Codex CLI, TcAgent Chat with ..."
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "The relevant lines of %LOCALAPPDATA%\\TcAgent\\logs or bridge\\bridge.log (anonymized)."
      render: text
  - type: checkboxes
    id: anonymized
    attributes:
      label: Check
      options:
        - label: The report contains no customer, machine or project names and no internal addresses or paths.
          required: true
