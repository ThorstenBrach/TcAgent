name: Question
description: How do I ...? Something in the setup or the behaviour of TcAgent is unclear.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The user guide answers many questions (see the links on the previous page). Please leave out customer, machine and
        project names - an issue is public.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know or achieve?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Prompts, tools, settings, the part of the user guide you followed - and what happened.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation and setup of the AI clients
        - PLC code, build and activation
        - Tests (TcUnit)
        - I/O, motion, HMI, system
        - Chat window
        - Knowledge (rules, skills, workflows, lessons, sources)
        - Pipeline and command line
        - Other
    validations:
      required: true
  - type: input
    id: tcagent
    attributes:
      label: TcAgent version
      placeholder: "0.42.3"
  - type: input
    id: twincat
    attributes:
      label: TwinCAT version
      description: TwinCAT XAE build, e.g. in the IDE under Help > About or TwinCAT > About TwinCAT
      placeholder: "3.1.4026.19"
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: IDE
      options:
        - Visual Studio 2022
        - Visual Studio 2019
        - TwinCAT XAE Shell (64-bit, 4026)
        - TwinCAT XAE Shell (32-bit, 4024 and older)
    validations:
      required: true
  - type: input
    id: ide_version
    attributes:
      label: IDE version
      description: Visual Studio under Help > About, XAE Shell under Help > About
      placeholder: "17.14.x / XAE Shell 4.0.x"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: "Claude Code, Copilot CLI, Gemini CLI, Codex CLI, TcAgent Chat with ..."
